name: ci-clang-format

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update the system packages
        run: sudo apt-get update

      - name: Install the dependencies
        run: sudo apt-get install -y build-essential pkg-config automake libncurses5-dev autotools-dev libparted-dev libconfig-dev libconfig++-dev dmidecode clang-format

      - name: Install meson build system
        run: sudo apt-get install -y meson ninja-build libjson-c-dev

      - name: Build libnvme dependency
        run: |
          wget https://github.com/linux-nvme/libnvme/archive/refs/tags/v1.16.1.tar.gz
          tar xvfz v1.16.1.tar.gz
          cd libnvme-1.16.1
          meson setup .build
          meson compile -C .build
          sudo meson install -C .build
          sudo ldconfig

      - name: Generate the autogen files
        run: ./autogen.sh

      - name: Configure the program
        run: ./configure CFLAGS='-O0 -g -Wall -Wextra'

      - name: Run the linting program
        run: make check-format
